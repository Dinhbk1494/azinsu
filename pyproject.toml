[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idor-hunter-agent"
version = "0.1.0"
description = "AI agent specialized in finding IDOR vulnerabilities"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.34.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "playwright>=1.44.0",
    "rich>=13.7.0",
    "structlog>=24.2.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "jinja2>=3.1.4",
]

[project.scripts]
idor-hunter = "agent.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
